<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Frontend UI Tests — analyze-loudness</title>
  <style>
    body { font-family: monospace; background: #111; color: #ccc; padding: 16px; }
    .pass { color: #4c4; }
    .fail { color: #f44; font-weight: bold; }
    .suite { color: #8bf; margin-top: 12px; }
    #summary { margin-top: 16px; font-size: 1.2em; }
  </style>
</head>
<body>
  <!-- Minimal DOM matching index.html structure (required by main.js) -->
  <header>
    <h1>Loudness Analyzer (BS.1770 / EBU R128)</h1>
  </header>
  <main>
    <form id="analyze-form" class="input-bar" aria-label="Analyze audio source">
      <input id="url-input" type="text" placeholder="YouTube URL or local file path" required>
      <button id="browse-btn" type="button">Browse</button>
      <button id="submit-btn" type="submit">Analyze</button>
      <button id="add-btn" type="button">+ Add Track</button>
      <button id="load-btn" type="button">Load JSON</button>
    </form>
    <div id="track-list" role="list"></div>
    <div id="compare-bar" class="compare-bar" hidden>
      <button id="clear-btn" type="button">Clear All</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="results" tabindex="-1"></div>
  </main>
  <div class="toolbar">
    <button id="lang-toggle" class="lang-toggle" type="button"></button>
    <button id="theme-toggle" class="theme-toggle" type="button"></button>
  </div>

  <div id="test-output"></div>
  <div id="summary"></div>

  <!-- Stub uPlot — chart rendering is not under test -->
  <script>
    window.uPlot = function() { this.destroy = function(){}; };
  </script>

  <!-- Stub chart renderers — return objects matching real API -->
  <script>
    window.renderTimeline = function(){ return { destroy: function(){}, ctx: null }; };
    window.renderCompareTimeline = function(){ return { destroy: function(){}, ctx: null }; };
    window.renderHistogram = function(){};
    window.renderHistogramCompare = function(){};
    window.renderSegments = function(){};
    window.isDark = function(){
      return document.documentElement.getAttribute("data-theme") === "dark";
    };
    window.getTheme = function(){
      return {
        surface: "#fff", fg: "#333", fgMuted: "#666", titleColor: "#0d47a1",
        separator: "#ccc", barFill: "#9c27b0", accent: "#9c27b0",
        border: "#ccc",
        trackColors: ["#B71C1C", "#1A237E", "#CC79A7", "#7E57C2", "#006064", "#3E2723"],
      };
    };
  </script>

  <!-- Stub the app's /common/settings.js: deterministic language and theme for
       assertions, and saves recorded instead of posted (failWith: the error a
       save rejects with) -->
  <script>
    window.analyzeSettings = {
      theme: "light",
      lang: "en",
      saved: [],
      failWith: null,
      save: function (name, value) {
        this.saved.push([name, value]);
        return this.failWith ? Promise.reject(new Error(this.failWith)) : Promise.resolve({});
      },
    };
  </script>

  <!-- update.js asks /update/status while main.js loads, before test_ui.js
       installs its fetch mock: answer as the packaged app does, with the
       launch check off so loading the page checks nothing. -->
  <script>
    (function () {
      var pageFetch = window.fetch;
      window.fetch = function(url, opts) {
        if (url === "/update/status") {
          return Promise.resolve(new Response(JSON.stringify({ current: "1.4.1", supported: true, launch_check: false }), { status: 200 }));
        }
        return pageFetch.call(window, url, opts);
      };
    })();
  </script>

  <!-- Load the actual frontend code -->
  <script src="../../vendor/py-analyze-common/src/analyze_common/web/i18n.js"></script>
  <script src="../../frontend/i18n.js"></script>
  <script src="../../frontend/gate.js"></script>
  <script src="../../vendor/py-analyze-common/src/analyze_common/web/update.js"></script>
  <script src="../../vendor/py-analyze-common/src/analyze_common/web/ui.js"></script>
  <script src="../../frontend/main.js"></script>

  <!-- Test runner -->
  <script src="test_ui.js"></script>
</body>
</html>
