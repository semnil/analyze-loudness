[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "analyze-loudness"
dynamic = ["version"]
description = "Download YouTube audio and analyze loudness (BS.1770 / EBU R128)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "matplotlib",
    "yt-dlp==2026.10.26",  # pinned per release; mirrored in py-analyze-common
    "yt-dlp-ejs==0.8.0",  # the YouTube challenge solver scripts yt-dlp reads; the version of yt-dlp's "pin" extra
    "static-ffmpeg",
]

[project.optional-dependencies]
gui = ["pywebview", "certifi"]
dev = ["pytest", "pytest-cov", "playwright>=1.40", "pyinstaller>=6.0", "uv"]

[project.scripts]
analyze-loudness = "analyze_loudness.cli:main"
analyze-loudness-gui = "analyze_loudness.gui:main"

[tool.hatch.version]
path = "src/analyze_loudness/__init__.py"

# Measures this package only; vendor/py-analyze-common is measured by its own repository's CI.
[tool.coverage.run]
source_pkgs = ["analyze_loudness"]
branch = true
relative_files = true
